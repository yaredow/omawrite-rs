[package]
name = "omawrite-rs"
version = "0.1.0"
edition = "2021"
description = "A minimalist, distraction-free Markdown writing app"
authors = ["yaredow"]

[dependencies]
# GUI framework
relm4 = { version = "0.9", features = ["libadwaita"] }
gtk4 = { version = "0.9", features = ["v4_10"] }
gio = "0.20"
libadwaita = { version = "0.7", features = ["v1_5"] }
sourceview5 = "0.9"

# File handling
tempfile = "3.14"
notify = "7"
fd-lock = "4.0"

# Async / Event utilities
glib = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

